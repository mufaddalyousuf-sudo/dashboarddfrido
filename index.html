<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frido Marketplace Intelligence</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23FFD100'/><text x='50' y='72' font-size='60' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='%23101820'>F</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="topbar" id="topbar">
  <div class="tb-left">
    <a class="logo" href="#/" aria-label="Home">F</a>
    <div class="tb-title">
      <h1><a href="#/">Frido <span>Marketplace Intelligence</span></a></h1>
      <p class="tb-meta" id="tbMeta">Loading snapshot…</p>
    </div>
  </div>
  <div class="tb-right" role="toolbar" aria-label="Dashboard controls">
    <div id="bestToggle" role="group" aria-label="Bestseller filter" data-tip="Compares Frido only against Bestseller-badged competitors. Flipkart's bestseller status can't be detected from this capture method, so it's marked Needs Verification rather than assumed absent.">
      <button class="on" data-best="1"><span data-icon="award"></span>Bestsellers</button>
      <button data-best="0"><span data-icon="package"></span>All products</button>
    </div>
    <label class="ctrl select-wrap" data-tip="Jump to category">
      <select id="catSelect" aria-label="Category"><option value="">All categories</option></select>
    </label>
    <button class="ctrl icon-btn" id="themeBtn" aria-label="Toggle theme" data-tip="Theme"><span data-icon="sun-moon"></span></button>
    <button class="ctrl icon-btn" id="settingsBtn" aria-label="Data &amp; method" data-tip="Data &amp; method"><span data-icon="info"></span></button>
  </div>
</header>

<main id="app" aria-live="polite"></main>

<footer class="foot">Live page-1 snapshots of amazon.in &amp; flipkart.com · Prices in ₹ INR · Myntra not tracked (stakeholder decision) · Frido taxonomy is the master hierarchy.</footer>

<div id="tip" class="tooltip" role="tooltip" hidden></div>
<script src="assets/icons.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
